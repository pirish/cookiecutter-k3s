apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ cookiecutter.namespace }}
  name: {{ cookiecutter.project_slug }}-deployment
  labels:
    app.kubernetes.io/managed-by: argo-cd
    app.kubernetes.io/part-of: {{ cookiecutter.namespace }}
    app.kubernetes.io/name: {{ cookiecutter.project_slug }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ cookiecutter.project_slug }}
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ cookiecutter.project_slug }}
    spec:
      {%- if cookiecutter.has_node_affinity %}
      nodeSelector:
        kubernetes.io/hostname: NODE_NAME
      {% endif %}
      containers:
      - name: app
        image: {{ cookiecutter.image }}:{{ cookiecutter.image_version }}
        imagePullPolicy: Always
        ports:
        - containerPort: {{ cookiecutter.container_port }}
          name: http
          protocol: TCP
        {%- if cookiecutter.has_configmap_env %}
        envFrom:
        - configMapRef:
            name: {{ cookiecutter.project_slug }}-env
        {%- endif %}
        args:
        {%- if cookiecutter.has_liveness_probe %}
        livenessProbe:
          httpGet:
            path: /ready
            port: {{ cookiecutter.container_port }}
          failureThreshold: 1
          initialDelaySeconds: 30
          periodSeconds: 10
        {%- endif %}
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
        {%- if cookiecutter.has_configmap_config %}
        - name: config
          mountPath: {{ cookiecutter.config_volume_path }}
          readOnly: true
          subPath: config.yaml
        {%- endif %}
        {%- if cookiecutter.has_volume_config %}
        - name: config
          mountPath: {{ cookiecutter.config_volume_path }}
          readOnly: true
        {%- endif %}
        {%- if cookiecutter.has_volume_data %}
        - name: data
          mountPath: {{ cookiecutter.data_volume_path }}
          readOnly: false
        {%- endif %}
        {%- if cookiecutter.has_volume_2 %}
        - name: volume-2
          mountPath: {{ cookiecutter.data2_volume_path }}
          readOnly: false
        {%- endif %} 
        {%- if cookiecutter.has_volume_3 %}
        - name: volume-3
          mountPath: {{ cookiecutter.data3_volume_path }}
          readOnly: false
        {%- endif %}

      volumes:
        {%- if cookiecutter.has_configmap_config %}
        # Create a config.yaml file from the ConfigMap below.
        - name: config
          configMap:
            name: {{ cookiecutter.project_slug }}-config
            items:
            - key: config.yaml
              path: config.yaml
        {%- endif %}
        {%- if cookiecutter.has_volume_config %}
        - name: config
          persistentVolumeClaim:
            claimName: {{ cookiecutter.project_slug }}-config-pvc
        {%- endif %}
        {%- if cookiecutter.has_volume_data %}
        - name: data
          persistentVolumeClaim:
            claimName: {{ cookiecutter.project_slug }}-data-pvc
        {%- endif %}
        {%- if cookiecutter.has_volume_2 %}
        - name: volume-2
          persistentVolumeClaim:
            claimName: {{ cookiecutter.project_slug }}-volume-2-pvc
        {%- endif %}
        {%- if cookiecutter.has_volume_3 %}
        - name: volume-3
          persistentVolumeClaim:
            claimName: {{ cookiecutter.project_slug }}-volume-3-pvc
        {%- endif %}
