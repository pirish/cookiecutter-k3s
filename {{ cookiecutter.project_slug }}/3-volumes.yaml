{%- if cookiecutter.has_volume_config %}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ cookiecutter.project_slug }}-config-pvc
  namespace: {{ cookiecutter.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 500Mi
{%- endif %}
{%- if cookiecutter.has_volume_data %}
