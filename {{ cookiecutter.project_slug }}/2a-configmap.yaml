{%- if cookiecutter.has_configmap_env -%}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ cookiecutter.project_slug }}-env
  namespace: {{ cookiecutter.namespace }}
  labels:
    app.kubernetes.io/name: {{ cookiecutter.project_slug }}-env
data:
  VARIABLE: value
{%- endif -%}
{%- if cookiecutter.has_configmap_config -%}
---
# This ConfigMap is just a way to define the cloudflared config.yaml file in k8s.
# It's useful to define it in k8s, rather than as a stand-alone .yaml file, because
# this lets you use various k8s templating solutions (e.g. Helm charts) to
# parameterize your config, instead of just using string literals.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ cookiecutter.project_slug }}-config
  namespace: {{ cookiecutter.namespace }}
  labels:
    app.kubernetes.io/name: {{ cookiecutter.project_slug }}-config
    app.kubernetes.io/part-of: {{ cookiecutter.project_slug }}
data:
  config.yaml: |
    ## Config file contents

{%- endif -%}
