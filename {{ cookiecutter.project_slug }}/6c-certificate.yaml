apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ cookiecutter.project_slug }}-traefik-cert
  namespace: {{ cookiecutter.namespace }}
  labels:
    app.kubernetes.io/name: {{ cookiecutter.project_slug }}-traefik-cert
spec:
  secretName: {{ cookiecutter.project_slug }}-cert-secret
  
  issuerRef:
    name: LOCAL_ISSUER
    kind: ClusterIssuer
  commonName: {{ cookiecutter.app_domain }}.{{ cookiecutter.cluster_base_domain }}
  dnsNames:
    - {{ cookiecutter.app_domain }}.{{ cookiecutter.cluster_base_domain }}